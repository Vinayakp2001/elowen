events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # HTTP — redirect all traffic to HTTPS
    server {
        listen 80;
        server_name elowen.co.in www.elowen.co.in;

        location / {
            return 301 https://elowen.co.in$request_uri;
        }
    }

    # HTTPS — main server
    server {
        listen 443 ssl;
        server_name elowen.co.in www.elowen.co.in;

        ssl_certificate     /etc/letsencrypt/live/elowen.co.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elowen.co.in/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Allow up to 20MB uploads for Payload CMS media
        client_max_body_size 20M;

        # Stripe webhook — disable buffering to preserve raw body for signature verification
        location /api/webhooks/stripe {
            proxy_pass         http://api:8000/webhooks/stripe;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_request_buffering off;
        }

        # Payload CMS API routes — must go to Next.js, not FastAPI
        location ~ ^/api/(users|products|categories|media|globals|nav-items|homepage-settings)(/.*)?$ {
            proxy_pass         http://web:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie $http_cookie;
        }

        # FastAPI — strip /api prefix before forwarding
        location /api/ {
            proxy_pass         http://api:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Web — proxy everything else to Next.js
        location / {
            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
