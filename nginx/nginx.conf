events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Docker internal DNS — resolves upstream hostnames dynamically
    resolver 127.0.0.11 valid=30s;

    # HTTP — redirect all traffic to HTTPS
    server {
        listen 80;
        server_name elowen.co.in www.elowen.co.in;

        location / {
            return 301 https://elowen.co.in$request_uri;
        }
    }

    # HTTPS — main server
    server {
        listen 443 ssl;
        server_name elowen.co.in www.elowen.co.in;

        ssl_certificate     /etc/letsencrypt/live/elowen.co.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elowen.co.in/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Allow up to 20MB uploads for Payload CMS media
        client_max_body_size 20M;

        # Variables for upstream — required when using resolver for dynamic DNS
        set $api http://api:8000;
        set $web http://web:3000;

        # PhonePe webhook — disable buffering to preserve raw body
        location /api/webhooks/phonepe {
            proxy_pass         $api/webhooks/phonepe;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_request_buffering off;
        }

        # Shiprocket status webhook — mirror the PhonePe block (prefix strip, buffering off).
        # Shiprocket's dashboard rejects URLs containing "shiprocket", so the
        # courier-status path is the one registered there; /shiprocket kept for completeness.
        location /api/webhooks/courier-status {
            proxy_pass         $api/webhooks/courier-status;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_request_buffering off;
        }

        location /api/webhooks/shiprocket {
            proxy_pass         $api/webhooks/shiprocket;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_request_buffering off;
        }

        # Next.js API routes (Payload CMS + custom route handlers) — must go to Next.js, not FastAPI.
        # products-by-skus and search are Next.js route handlers, not Payload collections; they are
        # listed explicitly because the (/.*)? suffix below only matches a slash, not the "-by-skus" tail.
        location ~ ^/api/(products-by-skus|search)$ {
            proxy_pass         $web$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie $http_cookie;
        }

        # Payload CMS API routes — must go to Next.js, not FastAPI
        location ~ ^/api/(users|products|categories|media|globals|nav-items|homepage-settings|collections|policies)(/.*)?$ {
            proxy_pass         $web$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Cookie $http_cookie;
        }

        # FastAPI — strip /api prefix before forwarding
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass         $api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Web — proxy everything else to Next.js
        location / {
            proxy_pass         $web;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
